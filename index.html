<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruso diario">
<meta name="theme-color" content="#B2382C">
<title>Ruso diario</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&family=Caveat:wght@500&family=PT+Mono&display=swap">
<style>
html,body{margin:0}
button,.key,.opt,.cell,.chip,.speak{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

/* Layout: cuaderno de estudio — cabecera fija con pestañas, una sola columna de fichas
   que se ensancha a dos en tablet. Tipografía rusa (familia PT) para el cirílico. */
:root{
  --paper:#EEEFEA;
  --surface:#FFFFFF;
  --ink:#17191C;
  --muted:#656A72;
  --line:#D5D7D0;
  --accent:#B2382C;
  --accent-soft:#F2DEDA;
  --blue:#1F4E79;
  --ok:#2C7A57;
  --ok-soft:#DDEDE4;
  --bad:#A32F26;
  --bad-soft:#F6DEDB;
  --font-display:"Oswald","Helvetica Neue",Arial,sans-serif;
  --font-body:"PT Serif",Georgia,"Times New Roman",serif;
  --font-mono:"PT Mono","SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121316;
    --surface:#1C1E22;
    --ink:#E7E7E2;
    --muted:#9AA0A8;
    --line:#2E3137;
    --accent:#E0695B;
    --accent-soft:#3A2320;
    --blue:#8CB8E4;
    --ok:#62BF93;
    --ok-soft:#1E3429;
    --bad:#E0695B;
    --bad-soft:#3A2320;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121316;
  --surface:#1C1E22;
  --ink:#E7E7E2;
  --muted:#9AA0A8;
  --line:#2E3137;
  --accent:#E0695B;
  --accent-soft:#3A2320;
  --blue:#8CB8E4;
  --ok:#62BF93;
  --ok-soft:#1E3429;
  --bad:#E0695B;
  --bad-soft:#3A2320;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:1.0625rem;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--font-display);font-weight:500;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ru{font-family:var(--font-body)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--paper);border-bottom:1px solid var(--line);
}
.bar{
  display:flex;align-items:baseline;gap:0.75rem;
  padding:0.75rem 1rem 0.5rem;max-width:61.25rem;margin:0 auto;
}
.brand{font-family:var(--font-display);font-size:1.375rem;text-transform:uppercase;letter-spacing:.08em}
.brand span{color:var(--accent)}
.sizer{display:flex;gap:4px;flex:none}
.sizer button{background:var(--surface);border:1px solid var(--line);border-radius:3px;font-family:var(--font-display);font-size:0.875rem;min-width:2.375rem;height:2.125rem;padding:0 0.375rem}
.bar{flex-wrap:wrap;align-items:center}
.meta{margin-left:auto;display:flex;gap:0.875rem;font-family:var(--font-mono);font-size:0.75rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:400}
nav{display:flex;gap:2px;padding:0 0.625rem;max-width:61.25rem;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;border-bottom:3px solid transparent;
  font-family:var(--font-display);font-size:0.9375rem;letter-spacing:.04em;
  padding:0.5rem 0.75rem 0.4375rem;color:var(--muted);white-space:nowrap;
}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible,.key:focus-visible,.opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

main{max-width:61.25rem;margin:0 auto;padding-block:1.125rem 3.5rem;padding-left:1rem;padding-right:1rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1.125rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.eyebrow{font-family:var(--font-mono);font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);font-size:0.9375rem}
.btn{
  background:var(--accent);color:#fff;border:0;border-radius:3px;
  font-family:var(--font-display);font-size:1.0625rem;letter-spacing:.04em;
  padding:0.8125rem 1.375rem;min-height:3rem;
}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:0.625rem}

/* ---------- hoy ---------- */
.plan{display:grid;gap:0.625rem;grid-template-columns:repeat(auto-fit,minmax(9.375rem,1fr))}
.plan div{border:1px solid var(--line);border-radius:3px;padding:0.625rem 0.75rem;min-width:0}
.plan .k{font-family:var(--font-mono);font-size:0.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plan .v{font-family:var(--font-display);font-size:1.1875rem}
.newletters{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:4px}
.newletters span{
  font-size:1.625rem;line-height:1;padding:0.5rem 0.75rem;border:1px solid var(--line);
  border-radius:3px;background:var(--accent-soft);color:var(--accent)
}

/* ---------- sesión ---------- */
.sess-top{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.875rem}
.progressbar{flex:1;height:0.375rem;background:var(--line);border-radius:3px;overflow:hidden;min-width:0}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.clock{font-family:var(--font-mono);font-size:0.875rem;color:var(--muted)}
.clock.over{color:var(--accent)}
.q{font-size:1.1875rem;margin:0 0 0.875rem}
.bigru{font-family:var(--font-body);font-size:clamp(3rem,16vw,5.375rem);line-height:1.05;text-align:center;margin:0.375rem 0 2px}
.bigword{font-family:var(--font-body);font-size:clamp(1.875rem,9vw,2.875rem);text-align:center;margin:0.375rem 0 2px;word-break:break-word}
.translit{font-family:var(--font-mono);font-size:0.875rem;color:var(--muted);text-align:center}
.opts{display:grid;gap:0.625rem;grid-template-columns:1fr}
@media(min-width:35rem){.opts{grid-template-columns:1fr 1fr}}
.opt{
  background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:0.875rem 1rem;text-align:left;min-height:3.25rem;font-size:1.0625rem;
}
.opt.ru{font-size:1.375rem}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict{margin-top:0.875rem;border-left:3px solid var(--line);padding:4px 0 4px 0.75rem;font-size:1rem}
.verdict.good{border-color:var(--ok)}
.verdict.bad{border-color:var(--bad)}
.verdict b{font-weight:700}

/* ---------- teclado ---------- */
.answer{
  min-height:3.5rem;border:1px solid var(--line);border-bottom:2px solid var(--accent);
  background:var(--surface);border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:1.875rem;letter-spacing:.02em;padding:0.375rem 0.625rem;margin:0.625rem 0;word-break:break-word;
}
.answer:empty::before{content:"…";color:var(--muted)}
.kb{display:flex;flex-direction:column;gap:0.375rem}
.kb-row{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.key{
  background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:0.5625rem 0;font-size:1.1875rem;min-height:2.625rem;text-align:center;
}
.key:active{background:var(--accent-soft)}
.key.wide{grid-column:span 3}

/* ---------- alfabeto ---------- */
.groupbar{display:flex;gap:0.375rem;flex-wrap:wrap;margin-bottom:0.875rem}
.chip{
  background:none;border:1px solid var(--line);border-radius:62.4375rem;
  padding:0.4375rem 0.8125rem;font-size:0.875rem;color:var(--muted);
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.25rem,1fr));gap:0.5rem}
.cell{
  background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:0.625rem 4px 0.5rem;text-align:center;position:relative;
}
.cell .pair{font-size:1.5625rem;line-height:1.1}
.cell .son{font-family:var(--font-mono);font-size:0.6875rem;color:var(--muted);margin-top:2px}
.cell.known{border-color:var(--ok)}
.cell.weak::after{content:"";position:absolute;top:0.3125rem;right:0.3125rem;width:0.4375rem;height:0.4375rem;border-radius:50%;background:var(--accent)}

.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
.sheet-inner{
  background:var(--surface);width:100%;max-width:35rem;border-radius:0.5rem 0.5rem 0 0;
  padding:1.25rem 1.125rem calc(1.375rem + env(safe-area-inset-bottom,0px));
  max-height:86vh;overflow-y:auto;border-top:3px solid var(--accent);
}
@media(min-width:38.75rem){.sheet{align-items:center}.sheet-inner{border-radius:0.375rem;border-top-width:3px}}
.exline{display:flex;align-items:baseline;gap:0.625rem;flex-wrap:wrap;padding:0.5625rem 0;border-top:1px solid var(--line)}
.exline .w{font-size:1.5rem}
.exline .t{font-family:var(--font-mono);font-size:0.8125rem;color:var(--muted)}
.exline .m{color:var(--muted)}
.speak{
  background:none;border:1px solid var(--line);border-radius:62.4375rem;
  width:2.375rem;height:2.375rem;flex:none;font-size:0.9375rem;line-height:1;
}

/* ---------- diccionario ---------- */
.search{
  width:100%;padding:0.8125rem 0.875rem;font:inherit;background:var(--surface);
  color:var(--ink);border:1px solid var(--line);border-radius:3px;margin-bottom:0.75rem;
}
.words{display:flex;flex-direction:column}
.wrow{display:flex;align-items:baseline;gap:0.75rem;padding:0.6875rem 2px;border-bottom:1px solid var(--line);min-width:0}
.wrow .w{font-size:1.3125rem;min-width:0}
.wrow .t{font-family:var(--font-mono);font-size:0.75rem;color:var(--muted)}
.wrow .m{margin-left:auto;text-align:right;color:var(--ink);min-width:0}

.note{font-size:0.875rem;color:var(--muted);border-top:1px solid var(--line);padding-top:0.75rem;margin-top:4px}
.flag{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0.625rem 0.75rem;font-size:0.9375rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- escritura a mano ---------- */
.padwrap{width:100%;max-width:24rem;margin:0.5rem auto 0}
.pad{display:block;width:100%;aspect-ratio:1/1;max-width:100%;background:var(--surface);border:2px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pad.good{border-color:var(--ok)}
.pad.bad{border-color:var(--bad)}
.padrow{display:flex;gap:0.375rem;justify-content:center;margin-top:0.5rem}
.padrow .pad{flex:1 1 0;min-width:0;max-width:9rem;width:auto}
.padtools{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-top:0.75rem}
.padtools .btn{padding:0.625rem 1rem;min-height:2.75rem;font-size:1rem}
.cmp{display:flex;gap:0.875rem;align-items:center;justify-content:center;margin-top:0.75rem}
.cmp .model{font-family:"PT Sans",var(--font-body);font-size:3.5rem;line-height:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

var voice = null, voiceChecked = false;
function findVoice(){
  if(!("speechSynthesis" in window)) return null;
  var vs = speechSynthesis.getVoices() || [];
  for(var i=0;i<vs.length;i++){ if((vs[i].lang||"").toLowerCase().indexOf("ru")===0) return vs[i]; }
  return null;
}
function initVoice(){
  if(!("speechSynthesis" in window)) { voiceChecked = true; return; }
  voice = findVoice();
  speechSynthesis.onvoiceschanged = function(){ voice = findVoice(); voiceChecked = true; };
  setTimeout(function(){ voice = voice || findVoice(); voiceChecked = true; }, 900);
}
function say(text, cb){
  if(!("speechSynthesis" in window)){ if(cb) cb("none"); return false; }
  try{
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(plain(text));
    u.lang = "ru-RU"; u.rate = 0.8; u.volume = 1;
    if(!voice) voice = findVoice();
    if(voice) u.voice = voice;
    var done = false;
    u.onstart = function(){ done = true; if(cb) cb("ok"); };
    u.onerror = function(ev){ if(!done && cb){ done = true; cb("error", ev && ev.error); } };
    if(cb) setTimeout(function(){ if(!done){ done = true; cb("silent"); } }, 2500);
    if(s.speaking || s.pending){
      s.cancel();
      setTimeout(function(){ try{ s.resume(); s.speak(u); }catch(e){} }, 80);
    } else {
      s.resume(); s.speak(u);
    }
    return true;
  }catch(e){ if(cb) cb("error"); return false; }
}
function audioState(){
  if(!("speechSynthesis" in window)) return "none";
  if(findVoice()) return "ok";

}

    q:"¿Qué sonido tiene esta letra?",
    big: row[0]+" "+row[1],
    opts: shuffle([row].concat(others)).map(function(x){ return {text:x[3], ok:x[0]===row[0]}; }),
    why: row[4], audio: row[6][0][0]
  };
}
function exLetra(ch){
  var row = byCh[ch];
  var others = shuffle(L.filter(function(x){ return x[0]!==row[0] && x[3]!==row[3]; })).slice(0,3);
  return {
    id:"L:"+row[0], type:"letra",
    q:"¿Qué letra suena «"+row[3]+"»?",
    opts: shuffle([row].concat(others)).map(function(x){ return {text:x[0]+" "+x[1], ok:x[0]===row[0], ru:true}; }),
    why: row[4]
  };
}
function exLeer(pool){
  var w = pick(pool);
  var others = shuffle(pool.filter(function(x){ return x[2]!==w[2]; })).slice(0,3);
  if(others.length < 3) others = shuffle(W.filter(function(x){ return x[2]!==w[2]; })).slice(0,3);
  return {
    id:"W:"+plain(w[0]), type:"leer",
    q:"Lee en voz alta. ¿Qué significa?",
    big:w[0], sub:w[1],
    opts: shuffle([w].concat(others)).map(function(x){ return {text:x[2], ok:x[2]===w[2]}; }),
    why:"«"+w[0]+"» se lee "+w[1]+" y significa "+w[2]+".",
    audio:w[0]
  };
}
function exEscribir(pool){
  var w = pick(pool.filter(function(x){ return plain(x[0]).length <= 7; }) || pool) || pick(pool);
  return {
    id:"W:"+plain(w[0]), type:"escribir",
    q:"Escribe en cirílico: «"+w[2]+"» ("+w[1]+")",
    target: plain(w[0]),
    why:"Se escribe "+w[0]+" — "+w[1]+".",
    audio:w[0]
  };
}
function exDictado(pool){
  var w = pick(pool.filter(function(x){ return plain(x[0]).length <= 7; }) || pool) || pick(pool);
  return {
    id:"W:"+plain(w[0]), type:"dictado",
    q:"Escucha y escribe lo que oigas.",
    target: plain(w[0]), audio:w[0], autoplay:true,
    why:"Era "+w[0]+" ("+w[1]+"): "+w[2]+"."
  };
}
function exFrase(){
  var f = pick(P);
  var others = shuffle(P.filter(function(x){ return x[1]!==f[1]; })).slice(0,3);
  return {
    id:"P:"+plain(f[0]), type:"frase",
    q:"Lee la frase. ¿Qué significa?",
    big:f[0],
    opts: shuffle([f].concat(others)).map(function(x){ return {text:x[1], ok:x[1]===f[1]}; }),
    why:"«"+f[0]+"» significa "+f[1],
    audio:f[0]
  };
}

function exCalca(c, ch){
  var row = byCh[c];
  ch = ch || (Math.random() < 0.5 ? row[0] : row[1]);
  return { id:"H:"+row[0], type:"calca", hand:true, ghost:ch, model:ch,
    q:"Calca la letra «"+ch+"» siguiendo la guía gris.",
    why:"Es la "+row[0]+" "+row[1]+" y suena «"+row[3]+"».", audio:row[6][0][0] };
}
function exMano(c){
  var row = byCh[c];
  return { id:"H:"+row[0], type:"mano", hand:true, cls:row[0], model:row[0]+" "+row[1],
    q:"Escribe a mano la letra que suena «"+row[3]+"». Vale mayúscula o minúscula.",
    why:"Es "+row[0]+" "+row[1]+". "+row[4], audio:row[6][0][0] };
}
function exManoPal(pool){
  var c = pool.filter(function(w){ var n = plain(w[0]).length; return n >= 2 && n <= 5; });
  if(!c.length) return null;
  var w = pick(c);
  return { id:"W:"+plain(w[0]), type:"manopal", hand:true, letters:plain(w[0]).split(""), model:w[0],
    q:"Escribe a mano, una letra en cada casilla: «"+w[2]+"» ("+w[1]+")",
    why:"Se escribe "+w[0]+".", audio:w[0] };
}
function buildEscritura(){
  var kl = knownLetters(), ex = [];
  var weak = kl.filter(function(c){ return isWeak("H:"+c); });
  shuffle(weak.slice()).slice(0,3).forEach(function(c){ ex.push(exMano(c)); });
  shuffle(kl.slice()).slice(0,4).forEach(function(c){ ex.push(exMano(c)); });
  shuffle(kl.slice()).slice(0,2).forEach(function(c){ ex.push(exCalca(c)); });
  var pool = unlockedWords();
  if(S.day >= 2){ var a = exManoPal(pool), b = exManoPal(pool); if(a) ex.push(a); if(b) ex.push(b); }
  return shuffle(ex).slice(0,10);
}

function buildSession(){
  var d = DAYS[Math.min(S.day,DAYS.length)-1];
  var pool = unlockedWords();
  if(pool.length < 4) pool = W.slice(0,20);
  var first = [], second = [], rest = [];
  d.l.forEach(function(c){ first.push(exSonido(c)); second.push(exCalca(c)); });
  shuffle(d.l.slice()).slice(0, Math.ceil(d.l.length/2)).forEach(function(c){ rest.push(exMano(c)); });
  d.l.forEach(function(c){ rest.push(exLetra(c)); });

  var old = knownLetters().filter(function(c){ return d.l.indexOf(c) < 0; });
  shuffle(old.filter(function(c){ return isWeak("L:"+c); })).slice(0,2).forEach(function(c){ rest.push(Math.random()<0.5 ? exSonido(c) : exLetra(c)); });
  shuffle(old.filter(function(c){ return isWeak("H:"+c); })).slice(0,2).forEach(function(c){ rest.push(exMano(c)); });
  shuffle(old.slice()).slice(0, d.l.length ? 1 : 3).forEach(function(c){ rest.push(exMano(c)); });

  var themed = d.temas ? pool.filter(function(w){ return d.temas.indexOf(w[3]) >= 0; }) : pool;
  if(themed.length < 6) themed = pool;
  var nRead = d.l.length ? 3 : 5;
  for(var i=0;i<nRead;i++) rest.push(exLeer(themed));
  rest.push(exEscribir(themed));
  if(S.day >= 2){ var mp = exManoPal(themed); if(mp) rest.push(mp); }
  if(!d.l.length){ var mp2 = exManoPal(themed); if(mp2) rest.push(mp2); }
  if(("speechSynthesis" in window) && S.day >= 4) rest.push(exDictado(themed));
  if(d.frases || S.day >= 12){ rest.push(exFrase()); rest.push(exFrase()); }

  var out = first.concat(second);
  return out.concat(shuffle(rest).slice(0, Math.max(6, 18 - out.length)));
}

function buildRepaso(){
  var ex = [], ids = Object.keys(S.srs).filter(function(k){ return S.srs[k].w > 0 || S.srs[k].due <= Date.now(); });
  shuffle(ids).slice(0,12).forEach(function(id){
    var kind = id.slice(0,2), v = id.slice(2);
    if(kind === "L:" && byCh[v]) ex.push(Math.random()<0.5 ? exSonido(v) : exLetra(v));
    else if(kind === "H:" && byCh[v]) ex.push(exMano(v));
    else if(kind === "W:"){
      var w = W.filter(function(x){ return plain(x[0]) === v; })[0];
      if(w) ex.push(Math.random()<0.5 ? exLeer([w].concat(shuffle(W).slice(0,8))) : exEscribir([w]));
    }
  });
  if(ex.length < 6){
    var pool = unlockedWords(); if(pool.length < 4) pool = W.slice(0,20);
    var kl = knownLetters();
    while(ex.length < 8){
      if(kl.length && Math.random()<0.5) ex.push(exLetra(pick(kl)));
      else ex.push(exLeer(pool));
    }
  }
  return shuffle(ex).slice(0,12);
}

function mountHand(e){
  sess.pads = [];
  Array.prototype.forEach.call(view.querySelectorAll("canvas[data-pad]"), function(c,i){
    sess.pads.push(Pad(c, { ghost: e.type === "calca" ? e.ghost : null, strokes: sess.hw && sess.hw[i], locked: sess.answered }));
  });
  livePads = sess.pads;
  Array.prototype.forEach.call(view.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(){
      var a = b.dataset.act;
      if(a === "undo"){ var p = (lastPad && sess.pads.indexOf(lastPad) >= 0) ? lastPad : null;
        if(!p) for(var i=sess.pads.length-1;i>=0;i--) if(!sess.pads[i].empty()){ p = sess.pads[i]; break; }
        if(p) p.undo(); }
      else if(a === "clear") sess.pads.forEach(function(p){ p.clear(); });
      else if(a === "skip"){ sess.skipped = true; sess.hw = sess.pads.map(function(p){ return p.strokes; }); sess.extra = ""; answer(false); }
      else checkHand(e);
    };
  });
}
function checkHand(e){
  var pads = sess.pads, msg = document.getElementById("hand-msg");
  if(pads.some(function(p){ return p.empty(); })){
    if(msg){ msg.textContent = pads.length > 1 ? "Escribe una letra en cada casilla." : "Escribe la letra primero."; msg.style.color = "var(--accent)"; }
    return;
  }
  sess.hw = pads.map(function(p){ return p.strokes.slice(); });
  if(e.type === "calca"){
    var r = traceScore(pads[0].strokes, e.ghost), ok = r.prec >= 0.72 && r.rec >= 0.72;
    sess.extra = ok ? "Trazo dentro de la guía al "+Math.round(100*Math.min(r.prec, r.rec))+"%."
      : (r.rec < 0.72 ? "Te faltan partes de la letra: recórrela entera." : "Te has salido de la guía: ve más despacio.");
    answer(ok);
  } else if(e.type === "mano"){
    var res = classify(pads[0].strokes), ok2 = judge(res, e.cls), got = res ? res[0][0] : null;
    sess.extra = ok2 ? "" : (got ? "Lo he leído como «"+got+" "+byCh[got][1]+"»." : "");
    answer(ok2);
  } else {
    var marks = [], read = [];
    e.letters.forEach(function(c,i){
      var rs = classify(pads[i].strokes);
      marks.push(judge(rs, byCh[c][0]));
      read.push(rs ? byCh[rs[0][0]][1] : "?");
    });
    sess.marks = marks; sess.readAs = read.join("");
    var all = marks.every(Boolean);
    sess.extra = all ? "" : "Revisa las casillas en rojo.";
    answer(all);
  }
}

/* ---- ESCRITURA ---- */
function renderEscritura(){
  var kl = knownLetters();
  var h = '<div class="stack"><section class="card"><div class="eyebrow">Escritura a mano</div>'
    + '<h2 style="font-size:1.625rem;margin:0.375rem 0 0.5rem">Escribe con el lápiz</h2>'
    + '<p class="lead" style="margin:0">Calca letras sobre una guía, escríbelas de memoria y después palabras enteras, una letra por casilla. La app reconoce lo que escribes y te corrige.</p>'
    + '<div class="row" style="margin-top:0.875rem"><button class="btn" id="hw-go">Práctica de escritura</button></div></section>';
  h += '<section><div class="eyebrow" style="margin-bottom:0.625rem">Practica una letra concreta</div><div class="grid">';
  L.forEach(function(x){
    var id = "H:"+x[0], it = S.srs[id];
    var cls = "cell" + (it && it.r > 0 && !isWeak(id) ? " known" : "") + (isWeak(id) ? " weak" : "");
    h += '<button class="'+cls+'" data-ch="'+x[0]+'"'+(kl.indexOf(x[0]) < 0 ? ' style="opacity:.5"' : '')+'><div class="pair">'+x[0]+' '+x[1]+'</div><div class="son">'+esc(x[3])+'</div></button>';
  });
  h += '</div><p class="note">Las letras atenuadas todavía no han salido en tus sesiones, pero puedes practicarlas igualmente. Verde: ya la escribes bien. Punto rojo: te cuesta.</p></section></div>';
  view.innerHTML = h;
  document.getElementById("hw-go").onclick = function(){ startSession(buildEscritura(), "escritura", false); };
  Array.prototype.forEach.call(view.querySelectorAll(".cell"), function(b){
    b.onclick = function(){
      var row = byCh[b.dataset.ch];
      startSession([exCalca(row[0], row[1]), exCalca(row[0], row[0]), exMano(row[0]), exCalca(row[0], row[1]), exMano(row[0])], "letra "+row[0], false);
    };
  });
}

/* ================= sesión ================= */
function startSession(ex, label, counts){
  if(!ex.length) return;
  sess = { ex:ex, i:0, right:0, wrong:[], label:label, counts:counts, answered:false, typed:"", start:Date.now(), limit:counts?600:0 };
  render();
  if(sess.limit){
    sess.timer = setInterval(function(){
      var el = document.getElementById("clock");
      if(!el || !sess) return;
      var left = sess.limit - Math.floor((Date.now()-sess.start)/1000);
      var over = left < 0, a = Math.abs(left);
      el.textContent = (over?"+":"") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0");
      el.className = "clock" + (over ? " over" : "");
    }, 1000);
  }
}
function endSession(){
  if(sess && sess.timer) clearInterval(sess.timer);
  var r = sess;
  sess = null;
  if(r && r.counts){
    var t = today();
    if(S.last !== t){
      S.streak = (S.last && daysBetween(S.last, t) === 1) ? S.streak + 1 : 1;
      S.last = t;
      if(S.done.indexOf(t) < 0) S.done.push(t);
      if(S.done.length > 400) S.done = S.done.slice(-400);
    }
  }
  save();
  renderSummary(r);
}

function renderSummary(r){
  var pct = r ? Math.round(100*r.right/r.ex.length) : 0;
  var h = '<div class="stack"><section class="card">';
  h += '<div class="eyebrow">Sesión terminada · '+esc(r.label)+'</div>';
  h += '<h2 style="font-size:1.875rem;margin:0.375rem 0 0.625rem">'+r.right+' de '+r.ex.length+' ('+pct+'%)</h2>';
  if(r.wrong.length){
    h += '<p class="lead">Para la próxima vez, vigila esto:</p><div style="margin-top:0.375rem">';
    r.wrong.forEach(function(w){ h += '<div class="exline" style="border-top:1px solid var(--line)"><span>'+w+'</span></div>'; });
    h += '</div>';
  } else {
    h += '<p class="lead">Sin fallos. Perfecto.</p>';
  }
  if(r.counts && S.day < DAYS.length){
    h += '<p class="note">Mañana te toca el día '+(S.day+1)+': '+esc(DAYS[S.day].t)+'.</p>';
  }
  h += '<div class="row" style="margin-top:1rem"><button class="btn" id="back">Volver</button>';
  if(r.counts && S.day < DAYS.length) h += '<button class="btn ghost" id="adv">Pasar al día '+(S.day+1)+'</button>';
  h += '</div></section></div>';
  view.innerHTML = h;
  document.getElementById("back").onclick = function(){ tab = "hoy"; syncTabs(); render(); };
  var adv = document.getElementById("adv");
  if(adv) adv.onclick = function(){ S.day = Math.min(S.day+1, DAYS.length); S.last = ""; save(); tab="hoy"; syncTabs(); render(); };
}

var KB = ["абвгдеёжзий","клмнопрсту","фхцчшщъыьэю"];
function renderSession(){
  var e = sess.ex[sess.i];
  var h = '<div class="stack"><section class="card">';
  h += '<div class="sess-top"><span class="eyebrow">'+(sess.i+1)+' / '+sess.ex.length+'</span>'
    + '<span class="progressbar"><i style="width:'+Math.round(100*sess.i/sess.ex.length)+'%"></i></span>'
    + (sess.limit ? '<span class="clock" id="clock">10:00</span>' : '')
    + '</div>';
  h += '<p class="q">'+esc(e.q)+'</p>';

  if(e.big) h += '<div class="'+(e.type==="sonido"?"bigru":"bigword")+'">'+e.big+'</div>';
  if(e.sub && sess.answered) h += '<p class="translit">'+esc(e.sub)+'</p>';
  if(e.audio) h += '<div style="text-align:center;margin:0.625rem 0 0.375rem"><button class="speak" id="play" aria-label="Escuchar">▶</button></div>';

  if(e.opts){
    h += '<div class="opts">';
    e.opts.forEach(function(o,i){
      var cls = "opt" + (o.ru ? " ru" : "");
      if(sess.answered) cls += o.ok ? " good" : (i === sess.choice ? " bad" : "");
      h += '<button class="'+cls+'" data-i="'+i+'">'+esc(o.text)+'</button>';
    });
    h += '</div>';
  } else if(e.hand){
    h += handUI(e);
  } else {
    h += '<div class="answer">'+esc(sess.typed)+'</div>';
    if(!sess.answered){
      h += '<div class="kb">';
      KB.forEach(function(row){
        h += '<div class="kb-row">';
        for(var i=0;i<row.length;i++) h += '<button class="key" data-k="'+row[i]+'">'+row[i]+'</button>';
        h += '</div>';
      });
      h += '<div class="kb-row"><button class="key" data-k="я">я</button><button class="key wide" data-k="back">⌫</button>'
        + '<button class="key wide" id="check">Comprobar</button><button class="key wide" id="skip">No lo sé</button></div>';
      h += '</div>';
    }
  }

  if(sess.answered){
    h += '<div class="verdict '+(sess.ok?"good":"bad")+'"><b>'+(sess.ok?"Bien.":"Casi.")+'</b> '+(sess.extra?esc(sess.extra)+' ':'')+esc(e.why||"")+'</div>';
    if(!sess.ok && !sess.skipped && (e.type === "mano" || e.type === "manopal" || e.type === "calca"))
      h += '<button class="btn ghost block" id="override" style="margin-top:0.875rem">La había escrito bien: cuéntala como acierto</button>';
    h += '<button class="btn block" id="next" style="margin-top:0.875rem">'+(sess.i+1 < sess.ex.length ? "Siguiente" : "Terminar")+'</button>';
  }
  h += '</section></div>';
  view.innerHTML = h;

  livePads = [];
  if(e.hand) mountHand(e);
  var play = document.getElementById("play");
  if(play) play.onclick = function(){ say(e.audio); };
  if(e.autoplay && !sess.answered && !sess.played){ sess.played = true; setTimeout(function(){ say(e.audio); }, 350); }

  Array.prototype.forEach.call(view.querySelectorAll(".opt"), function(b){
    b.onclick = function(){
      if(sess.answered) return;
      sess.choice = +b.dataset.i;
      answer(e.opts[sess.choice].ok);
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll(".key[data-k]"), function(b){
    b.onclick = function(){
      var k = b.dataset.k;
      if(k === "back") sess.typed = sess.typed.slice(0,-1);
      else sess.typed += k;
      var box = view.querySelector(".answer");
      if(box) box.textContent = sess.typed;
    };
  });
  var chk = document.getElementById("check");
  if(chk) chk.onclick = function(){ answer(sess.typed.trim() === e.target); };
  var skip = document.getElementById("skip");
  if(skip) skip.onclick = function(){ answer(false); };
  var ov = document.getElementById("override");
  if(ov) ov.onclick = function(){
    var it = S.srs[e.id];
    if(it){ it.w = Math.max(0, it.w-1); it.r++; it.b = Math.min(it.b+2, STEPS.length-1); it.due = Date.now() + STEPS[it.b]*86400000; }
    S.right++; sess.right++; sess.ok = true; sess.wrong.pop();
    if(sess.marks) sess.marks = sess.marks.map(function(){ return true; });
    sess.extra = "Anotado como acierto.";
    save(); render();
  };
  var nx = document.getElementById("next");
  if(nx) nx.onclick = function(){
    sess.i++; sess.answered = false; sess.typed = ""; sess.choice = -1; sess.played = false; sess.hw = null; sess.extra = ""; sess.marks = null; sess.readAs = ""; sess.skipped = false;
    if(sess.i >= sess.ex.length) endSession(); else render();
  };
}

function answer(ok){
  var e = sess.ex[sess.i];
  sess.answered = true; sess.ok = ok;
  grade(e.id, ok);
  if(ok) sess.right++;
  else {
    var tag = e.id.indexOf("H:") === 0 ? ("Escribir a mano "+e.id.slice(2)+" "+byCh[e.id.slice(2)][1]) : e.type === "manopal" ? ("Escribir a mano "+e.model) : e.id.indexOf("L:") === 0 ? (e.id.slice(2) + " " + byCh[e.id.slice(2)][1] + " — " + byCh[e.id.slice(2)][3]) : (e.big || e.target || e.id.slice(2));
    if(sess.wrong.indexOf(tag) < 0) sess.wrong.push(tag);
  }
  if(e.audio) say(e.audio);
  save();
  render();
}

/* ================= arranque ================= */
function syncTabs(){
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  });
}
Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){
  b.onclick = function(){
    if(sess && !confirmLeave()) return;
    tab = b.dataset.tab; syncTabs(); render();
  };
});
function confirmLeave(){
  if(sess && sess.timer) clearInterval(sess.timer);
  sess = null;
  return true;
}

var ZOOMS = [1, 1.15, 1.3, 1.45, 1.6, 1.8];
var zi = (function(){
  try{ var v = localStorage.getItem("ruso-zoom"); if(v !== null && ZOOMS[+v]) return +v; }catch(e){}
  return Math.min(window.innerWidth, window.innerHeight) >= 600 ? 2 : 1;
})();
function applyZoom(){
  document.documentElement.style.fontSize = (16*ZOOMS[zi])+"px";
  refitPads();
  try{ localStorage.setItem("ruso-zoom", String(zi)); }catch(e){}
}
document.getElementById("z-minus").onclick = function(){ if(zi > 0){ zi--; applyZoom(); } };
document.getElementById("z-plus").onclick = function(){ if(zi < ZOOMS.length-1){ zi++; applyZoom(); } };
applyZoom();

window.__ruso = { classify: classify, traceScore: traceScore, judge: judge };
loadLocal();
initVoice();
render();
connect();
fontsReady.then(function(){ try{ buildTemplates(); }catch(e){} refitPads(); });
})();
</script>
